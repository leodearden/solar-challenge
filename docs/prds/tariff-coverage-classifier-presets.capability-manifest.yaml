        binding: "flow._is_cheap_period and its mean_period_rate comparison exist at 9d7b67e; α deletes them"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "_is_cheap_period"
          paths: ["src/solar_challenge/flow.py"]
