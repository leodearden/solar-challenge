# Machine-readable twin of tariff-coverage-classifier-presets.capability-manifest.md
# (review-all stream S11). task_id values stay null until commit_planning stamps them.
# Every grep check fails on main 9d7b67e and passes once its leaf lands.
prd: docs/prds/tariff-coverage-classifier-presets.md
schema_version: 1
tasks:
