        binding: "observed: a negative rate prints an ERROR row and exits 1 today; gap, overlap and NaN print 'Configuration is valid'; α's tests observe the new refusals naming the clock ranges"
        verdict: PASS
        delivered_check:
          kind: manual
          reason: "message content is asserted by α's tests and the CLI rows of boundary row 2"
