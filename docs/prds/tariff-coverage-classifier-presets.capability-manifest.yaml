        binding: "measured: four- vs five-period tariff, home run 2024-01-10 on bristol-arbitrage.yaml: 10.2 kWh / GBP 1.67 vs 4.8 kWh / GBP 0.60; equal after α by the weighted-mean identity"
        verdict: PASS
