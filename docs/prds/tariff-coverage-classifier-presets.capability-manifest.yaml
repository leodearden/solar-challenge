        binding: "built by α (D27 invariant candidate 2); the file does not exist at 9d7b67e"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "def test_"
          paths: ["tests/unit/test_tariff_tiling.py"]
          expect: present
      - name: "invariant-2-briefing-line"
        binding: "review/briefing.yaml has a conventions section at 9d7b67e and no pointer to the tiling test"
        verdict: PASS
        delivered_check:
          kind: grep
