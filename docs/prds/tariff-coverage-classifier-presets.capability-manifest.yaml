        binding: "TariffPeriod.__post_init__ checks 'self.rate_per_kwh < 0' at 9d7b67e, admitting NaN and inf"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "if self\\.rate_per_kwh < 0"
          paths: ["src/solar_challenge/tariff.py"]
          expect: absent
