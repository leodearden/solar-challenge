# Machine-readable twin of component-defaults-one-home.capability-manifest.md
# Schema: dark-factory shared/src/shared/capability_manifest.py (CapabilityManifestDoc).
# Code anchors verified against main ac1fdf1 (2026-10-17); checks are pattern-anchored and
# path-scoped to src/ where S5's partition may move a symbol out of config.py.
# task_id stays null until commit_planning stamps it.
prd: docs/prds/component-defaults-one-home.md
schema_version: 1
signal_leaves: ["ε"]
tasks:
  - label: "α"
    task_id: 911
    title: "Heat-pump types as one per-type record: COP_CURVES and HEAT_PUMP_TYPES"
    capabilities:
      - name: "cop-curves-record-defined"
        binding: "new in α; absent on main (grep COP_CURVES: 0 in src/)"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "^COP_CURVES: Mapping\\[HeatPumpType, CopCurve\\]"
          paths: ["src/solar_challenge/heat_pump.py"]
          expect: present
      - name: "vocabulary-derived-from-the-literal"
        binding: "probe: typing.get_args(Literal['ASHP','GSHP']) == ('ASHP', 'GSHP')"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "^HEAT_PUMP_TYPES.*get_args\\(HeatPumpType\\)"
          paths: ["src/solar_challenge/heat_pump.py"]
          expect: present
      - name: "loose-cop-constants-deleted"
        binding: "grep: 8 ^(ASHP|GSHP)_COP_ assignments in heat_pump.py on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "(ASHP|GSHP)_COP_"
          paths: ["src/", "tests/"]
          expect: absent
      - name: "config-spells-no-type"
        binding: "grep: 6 'ASHP'/'GSHP' literals in config.py on main (the generator's tuple, message and cast, plus the docstring and comment)"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "'ASHP'|'GSHP'|\"ASHP\"|\"GSHP\""
          paths: ["src/solar_challenge/config.py", "src/solar_challenge/scenario_blocks.py", "src/solar_challenge/fleet_distribution.py"]
          expect: absent
      - name: "hand-kept-type-tuple-deleted"
        binding: "grep: `valid_types = (` in HeatPumpConfig.__post_init__ on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "valid_types = \\("
          paths: ["src/solar_challenge/heat_pump.py"]
          expect: absent
      - name: "curves-reproduced"
        binding: "probe values in PRD §3.3; the record holds the same floats and arithmetic"
        verdict: PASS
        delivered_check:
          kind: manual
          reason: "A1 is observed by α's parametrised test, not a grep"
