# Machine-readable twin of run-store-one-owner.capability-manifest.md (stream S19).
# Schema: dark-factory shared/src/shared/capability_manifest.py (CapabilityManifestDoc).
# task_id stays null until commit_planning stamps it at decompose.
# Every mechanical delivered_check was polarity-checked on main 1251be0 (2026-10-14):
# each 'present' pattern is absent today and each 'absent' pattern is present today.
prd: docs/prds/run-store-one-owner.md
schema_version: 1
tasks:
  - label: "α"
    task_id: null
    title: "Database: one connection policy for every SQLite connection"
    capabilities:
      - name: "database-value-holds-connection-policy"
        binding: "own-task — Database(path).connect() applies WAL, Row factory, foreign_keys=ON"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "class Database\\b"
          paths: ["src/solar_challenge/web/database.py"]
          expect: present
      - name: "jobs-opens-no-connection-of-its-own"
        binding: "grep:web/jobs.py JobManager._run_job sqlite3.connect (removed; connections come from Database)"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "sqlite3\\.connect"
          paths: ["src/solar_challenge/web/jobs.py"]
          expect: absent
  - label: "β"
    task_id: null
    title: "JobManager writes through the app's RunStorage; the jobs table is retired"
    capabilities:
      - name: "jobs-table-has-no-writer"
        binding: "grep:web/jobs.py INSERT/UPDATE/DELETE on jobs (deleted); no production reader exists"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "INTO jobs|UPDATE jobs"
          paths: ["src/solar_challenge/web"]
          expect: absent
      - name: "job-manager-takes-no-store-paths"
