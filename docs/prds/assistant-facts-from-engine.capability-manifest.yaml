        binding: "wired: _tool_results JSON-dumps explain_metric's dict into the tool_result; FakeAnthropic.calls records the second stream call (B1)"
        verdict: PASS
        delivered_check:
          kind: manual
          reason: "B1 asserted by α's own chat-route test against the constants; strings are formatted from values only known after 818 and 823"
