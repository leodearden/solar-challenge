        binding: "grep: 'Ofgem' x5 in web/assistant.py on main; S14 δ corrects the table's comment (not Ofgem's low/medium/high)"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "Ofgem"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: absent
      - name: "reads-load-table"
        binding: "grep: load.OFGEM_TDCV_BY_OCCUPANTS exists (frozen, read only); not referenced by web/assistant.py on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "OFGEM_TDCV_BY_OCCUPANTS"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: present
      - name: "reads-validation-bands"
        binding: "producer: task 818 (S14 δ), upstream; creates UK_PV_ONLY_/UK_BATTERY_SELF_CONSUMPTION_BENCHMARK_PERCENT and the public UK_YIELD_BENCHMARK_KWH_PER_KWP"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "UK_PV_ONLY_SELF_CONSUMPTION_BENCHMARK_PERCENT"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: present
      - name: "bristol-yield-constant-defined"
        binding: "delivered by α; value from docs/pv-cell-temperature.md, produced by task 823 (S14 ε), upstream"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "^BRISTOL_DEFAULT_SYSTEM_YIELD_KWH_PER_KWP"
          paths: ["src/solar_challenge/validation.py"]
          expect: present
      - name: "suggest-config-sizes-with-the-constant"
        binding: "delivered by α; suggest_config divides by _UK_YIELD_KWH_PER_KWP on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "BRISTOL_DEFAULT_SYSTEM_YIELD_KWH_PER_KWP"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: present
      - name: "slow-guard-binds-constant-to-measurement"
        binding: "grep: tests/integration/test_pv_performance_ratio.py measures site.with_losses for Bristol (slow); rel=0.01 basis in the .md manifest"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "BRISTOL_DEFAULT_SYSTEM_YIELD_KWH_PER_KWP"
          paths: ["tests/integration/test_pv_performance_ratio.py"]
          expect: present
      - name: "document-names-the-constant"
        binding: "producer: task 823 writes docs/pv-cell-temperature.md; α adds one line naming the constant"
        verdict: PASS
        delivered_check:
          kind: grep
