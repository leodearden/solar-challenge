# Machine-readable twin of assistant-facts-from-engine.capability-manifest.md
# (review-all stream S22). α's task_id stays null until commit_planning stamps it.
# β is the pre-existing task 751 (fk-93d3bd7aa219), re-scoped in place by update_task at decompose.
# Code anchors verified against main ac1fdf1 (2026-10-17); checks are pattern-anchored.
prd: docs/prds/assistant-facts-from-engine.md
schema_version: 1
signal_leaves: ["α", "β"]
tasks:
  - label: "α"
    task_id: null
    title: "The assistant's facts are read from the engine"
    capabilities:
      - name: "contradicting-tdcv-literals-deleted"
        binding: "grep: web/assistant.py holds 2,900/3,100/4,200, 1,900/2,700/4,100 and 1,900/2,900/4,200 on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "2,900|3,100 kWh|4,200|1,900|4,100"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: absent
      - name: "contradicting-bands-deleted"
        binding: "grep: web/assistant.py holds 30–40 %, 55–70 %, 850–950 and 900–970 on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "30–40|55–70|850–950|900–970"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: absent
      - name: "rule-of-thumb-yield-deleted"
        binding: "grep: _UK_YIELD_KWH_PER_KWP = 950.0 in web/assistant.py on main"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "_UK_YIELD_KWH_PER_KWP"
          paths: ["src/solar_challenge/web/assistant.py"]
          expect: absent
