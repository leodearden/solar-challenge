        binding: "probe: a computed __all__ fails a mypy --strict consumer's star import (name-defined per name); a literal list passes. Premise correction to the stream row: derivation FAILS, so __all__ and the TYPE_CHECKING block stay literal and the all-pairs check replaces it"
        verdict: PASS
        delivered_check:
          kind: manual
          reason: "a design premise, not a deliverable; recorded so the decompose re-walk does not re-propose derivation"
