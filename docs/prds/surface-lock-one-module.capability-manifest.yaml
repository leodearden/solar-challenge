        binding: "grep: __init__.py's RuntimeError compares set(_SYMBOL_MODULE) with set(__all__) only; _SOURCE_NAME keys and duplicates are unchecked on main"
        verdict: PASS
        delivered_check:
          kind: manual
          reason: "B2/B3 are behavioural subprocess tests α writes (a stale alias and a duplicate each refuse import, naming the name); their verdict is the verify's"
