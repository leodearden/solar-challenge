# task_id stays null until commit_planning stamps it. θ depends on task 366 (out of batch).
# Decompose session, 2026-10-17: every mechanical check re-run against main 2ff5673.
# Five checks re-scoped so that each fails today and can pass once its leaf lands,
# and stays green after later leaves; each says why in its binding or reason.
