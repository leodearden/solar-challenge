  web-dashboard:
    purpose: >
      A zero-infrastructure local Flask UI over the simulator AND the finance engine: configure
      single-home or fleet runs in a browser, execute them as background jobs with live progress,
      explore results through interactive Plotly charts, build/validate scenarios, run parameter
      sweeps, browse/compare run history, and chat with an AI assistant that can explain results
      and trigger simulations. For users who don't want the CLI.

    key_scenarios:
      - "A user fills the single-home form (now including heat-pump, tariff/TOU, battery-dispatch, PV-age, and SEG panels), submits it, a background thread runs the sim while an SSE stream drives a live progress bar, then the results page renders Plotly charts — including a financial chart priced from the engine's configured tariff/SEG series (no hardcoded rates)."
      - "A completed run is persisted (SQLite metadata row + on-disk config.json/summary.json/parquet) and reappears in the run-history browser; users sort, filter, rename, delete, CSV/YAML-export, and compare 2-4 runs."
      - "A user configures a fleet-from-distribution run in the browser and it actually executes (generates homes, applies a fleet-wide tariff/dispatch/SEG overlay, runs N background jobs) — the old HTTP-501 stub is gone."
      - "A user builds a scenario in the dual-pane editor with live YAML preview, validates, and saves / downloads / uploads YAML or loads a preset."
      - "A user chats with the AI assistant: a streaming (SSE) Claude-backed conversation with a 6-tool agentic loop — advisory (explain_metric / suggest_config), read (get_run_results / list_recent_runs), and TRIGGER (run_home_simulation / run_fleet_simulation via the JobManager) — persisted to the chat_messages table, degrading gracefully when no API key is present."

    what_working_means:
      - "The server starts (`solar-challenge web start`), creates the SQLite DB at the current schema version or refuses a store at another version, naming it (`solar-challenge web migrate` migrates an older one), and serves the dashboard at 127.0.0.1."
      - "A single-home sim submitted via the API runs to completion as a background job, streams progress over SSE, and persists results that load on the results page."
      - "Charts render (server serialises Plotly figures to JSON; the browser draws them, deferring hidden-tab charts)."
      - "The assistant either streams a real Claude response (key present) or returns a graceful SSE error frame (key absent); chat history persists and reloads."
      - "The history list loads and paginates; the Playwright e2e suite passes against a real in-process Flask server."

    key_decisions:
      - decision: "Background jobs use a threading ThreadPoolExecutor with versioned in-memory job snapshots + SSE — no Celery/Redis/WebSocket. Each progress stream reads its job's latest snapshot (JobManager.job_snapshot, through web/sse.py's job_progress_frames) and keeps its own cursor, starting at the request's Last-Event-ID, so no stream consumes another's states and a reopened stream resumes (S20 γ, task 886)."
        why: "The tool is a local desktop-class app; zero external infrastructure is a stated goal. Consequences (correct, not bugs): one process per store, enforced: create_app takes a POSIX flock on <DATA_DIR>/dashboard.lock (web/store_lock.py) before it opens the database or fails interrupted runs, so a second `web start` on the store, or a second create_app in one process, is refused naming the lock file and the holder's pid, and under --debug only the reloaded serving process takes it (web/reloader.py); it MUST still run single-worker, since a process forked after create_app shares the lock, so a host that forks workers from one built app (e.g. `gunicorn --preload`) gets past it; and in-memory job state is lost on restart (a run its job left running is marked failed, \"Interrupted by server restart\", at the next start; a job that finished more than ~1h ago returns 404 even though its run's runs row, the job's durable outcome, persists, while a queued or running job stays tracked until it finishes (task 552))."
      - decision: "One job state table, one writer; the run row follows the job (S20 β, task 883). web/jobs.py's LEGAL_JOB_TRANSITIONS is the only statement of which job status may follow which (queued → running | failed | cancelled; running → running | completed | failed | cancelled; completed, failed and cancelled are terminal), and TERMINAL_JOB_STATUSES is derived from it. JobManager's one writer of job state refuses any other move with IllegalJobTransition naming the job, its run and both statuses (check_job_transition), and stamps finished_at only on a move into a terminal status. The done-callback makes every job terminal before wait_until_idle stops counting it: a job shutdown drops reports failed, 'Dropped: the server shut down before the job ran'. RunStorage.save_home_run/save_fleet_run write no status: a new row is 'running', and an existing row keeps its status, error and completion time. Only the lifecycle methods write a run's status: create_run records it 'running', and mark_run_completed, mark_run_failed and fail_interrupted_runs move it from 'running' only, the first two refusing any other status with RunStatusConflict."
        why: "fk-484952247bb6: the job state was overwritten unchecked, finished_at was stamped whatever the status, and the save wrote 'completed' before the job reported completion, which let a later failure report a saved run failed. J3: a job reports completed only after its run row reads completed; the save, mark_run_completed and the in-memory move run under the job's cancellation lock. A failure is always reported in memory; its row write is best-effort and logged at ERROR naming the job and run, with the next start's fail_interrupted_runs as the backstop. That is the G7 waiver of docs/prds/job-events-and-sse-framing.md §15, with §3.4 as the design. The guards are tests/unit/web_jobs/test_job_transitions.py and tests/unit/test_web_run_lifecycle.py."
      - decision: "SQLite holds metadata/summaries/config; time-series go to on-disk parquet under ~/.solar-challenge/runs/<id>/; Jinja + Alpine.js (no SPA, no HTMX); compiled Tailwind (dist/style.css)."
        why: "Keeps SQLite small/fast and avoids BLOBbing arrays; a deliberate 'no SPA' stance. NOTE: compiled Tailwind means dist/style.css must be rebuilt when new utility classes are used, or they render unstyled."
      - decision: "JSON endpoints are consolidated under /api/ (api.py blueprint); the page routes in routes.py are FULL Jinja page renderers."
        why: "A refactor centralised the JSON/API surface. CORRECTION vs the prior briefing: routes.py are NOT thin redirect shims — they render pages. Only the earlier history/scenarios blueprints were folded into api_bp. A reviewer should not assume page-route logic is 'missing/moved'."
      - decision: "The AI assistant uses a DEFERRED `import anthropic` (anthropic is in the `web` extra, not core); model defaults to claude-opus-4-8 (configurable via SOLAR_ASSISTANT_MODEL) with adaptive thinking + prompt caching."
        why: "The deferral is for import cost, not for missing-SDK tolerance: `import anthropic` costs ~0.8-1.0 s cumulative, so building the app must not pay it (pinned by test_building_the_app_does_not_import_the_anthropic_sdk). The SDK is a declared `web`-extra dependency installed in every verify lane, so there is no graceful-degrade path to preserve. IMPORTANT: two of the six tools (run_home_simulation / run_fleet_simulation) submit REAL jobs via the JobManager — they are not read-only, so a reviewer auditing the tool surface should weigh that the assistant can trigger work."
      - decision: "The assistant's engine facts are formatted once, at import, from the engine's constants (task 907, 2026-10-22): the default annual consumption by occupants (load.OFGEM_TDCV_BY_OCCUPANTS), validation's self-consumption and yield bands (its UK_* constants), and the default system's Bristol yield (validation.BRISTOL_DEFAULT_SYSTEM_YIELD_KWH_PER_KWP), which suggest_config also sizes PV with. The bands with no engine counterpart keep their external citations: self_sufficiency, solar_fraction, grid_export, battery_cycles, and the system prompt's PV and battery size bands."
        why: "One fact, one home (docs/prds/assistant-facts-from-engine.md §6). The by-occupants table is the project's own interpolation, so the assistant quotes no low/medium/high TDCV, and grid import has no fixed benchmark. Do not reintroduce literal figures in web/assistant.py: a model re-baseline moves the constant, which tests/integration/test_pv_performance_ratio.py binds to the measurement."

    known_gaps:
      - what: "docs/web-ui-design.md residual drift: it still specifies HTMX (code uses Alpine.js) and Tailwind CDN play-mode (code compiles dist/style.css)."
        why: "The doc's AI-assistant section is now BUILT (so that part of the old drift is resolved), but the HTMX/CDN spec is stale. The doc is NOT an authoritative spec of record — flag divergence for human reconciliation, don't treat the doc as ground truth. tracking: null"
        tracking: null

    exclude:
      - "tests/e2e fixtures and seeded databases — test scaffolding, not product code (the e2e tests themselves ARE in scope)."
      - "~/.solar-challenge/ runtime data dir (DB + parquet) — user runtime state, not in the repo."

