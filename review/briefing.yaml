project: solar-challenge   # canonical orchestrator project_id: solar_challenge (repo renamed from my-solar-challenge on 2026-07-08)
# NOTE: this repo is a single Python package (src/solar_challenge) with one
# pyproject.toml. It is split below into THREE LOGICAL subprojects — the physics
# simulation core, the finance/economics layer, and the web dashboard — purely to
# give /review well-scoped focus areas. The package's frozen-public-API / domain-
# library boundary is cross-cutting and lives in `conventions`, not a subproject.

# Conventions and rules with teeth — violations are bugs. Rationale included so a
# reviewer understands WHY, not just WHAT.
conventions:
  - rule: >
      Energy balance must close at every timestep:
      generation + grid_import = demand + grid_export + (battery_charge - battery_discharge),
      within ~0.001 kWh tolerance — at the per-home level AND at the community level.
    why: >
      This is the core correctness invariant of the simulator. The per-timestep flow
      logic enforces it (validate_energy_balance, on by default) and raises on violation.
      The community-sharing layer extends it as a composition theorem
      (validate_community_balance) over the per-home balances. Any change to dispatch,
      energy-flow accounting, grid-charge source-splitting, or community netting that
      breaks closure is a real bug, not a rounding quirk.

  - rule: "Grid export must be valued at the export/SEG rate, never at the import tariff rate."
    why: >
      Exported energy earns the Smart Export Guarantee rate (typically flat, ~3-5 p/kWh),
      not the import price. This was the original task-#2 fix and the CANONICAL cost-recovery
      path is correct: SEG is threaded via seg_tariff (HomeConfig) and/or
      seg_tariff_pence_per_kwh (ScenarioConfig → calculate_summary). The former LATENT BUG
      here is now FIXED (Task 85, commit 70e9e909, merged 2026-06-30): the export-revenue
      branch in home.py (~home.py:333-349) used to fall back to pricing export at the
      per-timestep IMPORT rate when a TOU tariff_config was set but no SEG was configured,
      silently valuing peak-hour exports at ~25 p/kWh and corrupting the investor case.
      Task 85 removed that branch — export_revenue is now unconditionally 0.0 for every
      timestep when seg_tariff is None, with a UserWarning emitted when tariff_config is set.
      /review should NOT flag the import-rate fallback as an active bug, but the invariant
      itself remains worth enforcing on any future dispatch/pricing change. (Follow-on: Task 85's
      fix surfaced a downstream finance seam — scenario-level seg_tariff_pence_per_kwh is ignored
      by the 25-yr CBS projection, yielding £0 CBS export income — tracked separately, not this rule.)

  - rule: "A TariffConfig's periods tile the local day exactly once; TariffConfig refuses a gap or overlap at construction, naming the clock times (tests/unit/test_tariff_tiling.py)"
    why: >
      get_rate reads the minute table construction builds, so the check and the lookup are one
      structure: a gap no longer fails mid-simulation at its first uncovered minute, and an
      overlap is no longer billed at the first listed period's rate (fk-872021ade9b6; D27
      invariant 2; docs/prds/tariff-coverage-classifier-presets.md §5.1).

  - rule: "One owner of each seam of the dashboard's store: under src/solar_challenge/web only database.py opens a SQLite connection (Database.connect), only storage.py issues SQL against the runs table, its migrations included, and only app.py builds a RunStorage and reads the store's location from the Flask config (tests/unit/test_web_runs_table_owner.py)"
    why: >
      JobManager used to write the runs table with its own positional INSERT, api, assistant and
      routes read it with their own SQL, decoders and fallbacks, and api.py and assistant.py read
      the store's location from current_app.config (fk-df9d0fc1b2d3, fk-bfdae4525795). Now each
      has one home: the connection policy in Database; every runs statement in storage.py, in
      RunStorage, which the other modules take from the app through shared.get_storage(), and in
      the runs table's migration functions; and the store's location in create_app. The test's
      _SEAMS is the allow-list D27 ratified, and the web persistence code that later streams add
      (S2, S10, S12, S16, S20, S25, S28) is held to it. A seam that moves to another module
      changes _SEAMS and this line together (D27 invariant 4; contract C1;
      docs/prds/run-store-one-owner.md §3.12).

  - rule: "The dashboard database's schema version matches the code, and its runs table matches RunRecord: open_database creates a new store at schema.SCHEMA_VERSION with one runs column per RunRecord field, and refuses a store at any other version, naming its path and both versions, until `solar-challenge web migrate` brings an older one there (tests/unit/test_web_schema.py)"
    why: >
      Stores used to be created by CREATE TABLE IF NOT EXISTS with no version, so a constraint
      added later never reached an existing store, and the policy was to delete the database
      (D19; fk-1070454e4c6e). A migrated store's sqlite_master equals a new one's (contract C3),
      and a DDL change ships as a new migration step with its version's snapshot,
      tests/fixtures/databases/schema_v<N>.sql (D27 invariant 7;
      docs/prds/run-store-one-owner.md §3.9).

  - rule: "A stored run names the format version that wrote it (format.json, stored_runs.RUN_FORMAT_VERSION), and a loader refuses a run it cannot rebuild with StoredRunUnreadable naming the run id, the document and the field (tests/unit/test_web_stored_run_format.py)"
    why: >
      Stored runs used to be read leniently: unknown keys were skipped, wrong types and nulls
      passed through, and a constructor's error escaped as a 500 (fk-273b8b09c91a). A
      stored-dataclass shape change ships with a RunDocumentStep, a schema step and a fixture,
      run by tests/unit/test_web_run_document_steps.py (contract C10), and `solar-challenge web
      migrate` brings older runs forward (D27 invariant 6; D-S19-5;
      docs/prds/run-store-one-owner.md §3.10).

  - rule: "All config and domain objects are frozen dataclasses, validated in __post_init__, and must stay picklable."
    why: >
      Immutability + picklability are load-bearing, not stylistic: HomeConfig and friends are
      shipped to ProcessPoolExecutor workers for fleet parallelism. A mutable or unpicklable
      config field silently breaks fleet runs. Domain constraints belong in __post_init__,
      enforced at construction time.

  - rule: >
      Fleet simulations must be reproducible from a single seed: per-home seed = fleet_seed + index,
      and stochastic draws run only inside load.py's RNG hand-off, which seeds both generators
      (numpy and the stdlib `random` module) from the call's seed (fresh entropy when unset) and
      restores them.
    why: >
      Reproducibility is a project requirement — planners re-run the canonical Bristol fleet
      and expect identical homes; parallel execution order must never affect results. The
      `bristol_legacy` random-ordering mode exists specifically to preserve the original
      scenario's exact sampling sequence; it looks like a code smell but is intentional
      backward-compatibility — do not "simplify" it away. tests/unit/config/test_fleet_generation_pins.py
      pins the drawn fields of every shipped fleet and of a probe set, both random orders included,
      and only a change meant to move generated fleets regenerates those goldens
      (`uv run --locked --extra dev python -m tests._fleet_generation_pins`), with an Unreleased on
      main line in docs/domain-library-consumption.md. A profile must not depend on what ran
      before it or beside it on another thread: tests/unit/test_load_reproducibility.py pins that,
      and tests/unit/web_jobs/test_seeded_jobs_reproduce.py pins it for two seeded dashboard jobs
      run together. tests/unit/test_global_rng_calls.py pins that the hand-off is the only src code
      calling a module-level function of random or numpy.random.

  - rule: "mypy --strict must pass; do not widen ignore_missing_imports or add Any-typed config fields."
    why: >
      Strict typing is the safety net for a numerics-heavy codebase that is now a typed library
      (ships py.typed) consumed by a downstream repo under its own mypy --strict. The only
      sanctioned untyped imports are stub-less third-party libs (pvlib/pandas/numpy/yaml/flask/
      plotly/richardsonpy/scipy/anthropic). Eroding this leaks Any into a consumer's type checks.

  - rule: >
      No solar_challenge module imports another solar_challenge module inside a function,
      unless ALLOWED_FUNCTION_LOCAL_IMPORTS in tests/unit/test_import_structure.py lists the
      (importing module, imported module) pair with its reason. The reason is Permanent, naming
      the documented contract that requires the laziness (the cheap top-level import, or the
      optional web extra), or Transitional, naming the task or program stream that removes the
      import.
    why: >
      A function-local package import hides a dependency from the module's top, usually to dodge
      an import cycle. Eleven did that until task 773 put ConfigurationError in the errors leaf
      (INV-5; docs/prds/errors-leaf.md §7). The per-task verify runs the test, which checks both
      ways: an import the list lacks fails it, naming its file:line and the imported module, and
      so does an entry that no import matches any more. So the change that removes a deferred
      import deletes its entry in the same commit.

  - rule: >
      The project's own code is AGPL-3.0-or-later (pyproject is authoritative). pyproject's license
      expression also names MIT for the third-party code the wheel bundles: the scripts vendored
      under src/solar_challenge/web/static/vendor/ and the Tailwind CSS compiled into
      src/solar_challenge/web/static/dist/style.css. Each ships its license text beside it and
      under license-files. For the compiled CSS that means verbatim copies, beside it in
      static/dist, of the tailwindcss package files that tests/_tailwindcss_license_copies.py
      names, which a Tailwind upgrade refreshes from the new tailwindcss package.
      New dependencies and vendored code must be AGPL-compatible.
    why: >
      Copyleft obligations apply to the whole work, so a proprietary or GPL-incompatible
      dependency is a licensing bug. The AND in pyproject's license expression is not a
      discrepancy: PEP 639 and PyPA's licensing guide have a package that includes code under
      another license name both (task 354). MIT requires its copyright and permission notices in
      all copies or substantial portions, and the compiled CSS's one-line banner carries neither
      (task 380). (The old README-says-MIT discrepancy is RESOLVED — README now states AGPL, and
      points at pyproject's license expression for the bundled third-party code.)

  - rule: >
      The public API surface is a FROZEN CONTRACT. `solar_challenge.__all__` (the names
      FROZEN_SURFACE in tests/unit/test_public_api_surface.py pins),
      the signatures of the exported callables, and the public members of the exported classes
      (the methods, classmethods, properties, class constants and instance attributes each class
      body defines or declares) are consumed by a separate, pinned repo. The contract also covers
      the classes outside __all__ that the exported surface names, directly or through another
      such class, such as HomeConfig, SimulationResults, SimulationPeriod and GridChargeConfig:
      their constructors and public members. For each class the contract covers that is a
      dataclass, the contract also covers which of the dataclass parameters eq, order,
      unsafe_hash and frozen it sets. Other names importable only from submodules stay
      outside it; this refines the freeze policy in docs/prds/domain-library-extraction.md §3.1.
      Adding, removing, renaming, or changing the signature of a public symbol or member is a
      BREAKING CHANGE that requires a deliberate version/tag bump — never a silent edit. Each class
      the contract covers declares in its class body each public attribute it sets on its
      instances, as an annotation such as `cache_dir: Path`.
    why: >
      This package was extracted as a domain library; `solar-challenge-platform` depends on it
      via a git tag and builds against the frozen surface. Members are in the contract (task 404)
      because consumers rely on them: a consumer's own dispatch strategy implements
      DispatchStrategy.decide_action and name, and the consumption guide's own recipe calls
      WeatherCache.put. Public instance attributes are members too (task 426): the platform reads
      Battery.config and max_soc_fraction, and reads and assigns min_soc_fraction. Battery.config
      stays a plain attribute declared as an annotation. Battery's SOC limits and efficiencies are
      settable properties (task 540): their setters refuse, with ValueError, a value outside the
      bounds Battery() checks for them, and do not check a new SOC limit against the current SOC.
      Keep both: the platform assigns min_soc_fraction, and may raise the floor above the SOC, as a
      Victron Mode-2 min-SOC write can. The classes outside __all__ that the
      exported surface names are in the contract too (task 505): the closure rule of
      docs/prds/domain-library-extraction.md §2 puts a frozen function's parameter and return
      types in the frozen surface, and consumers need these classes to use exported names. A
      ScenarioConfig needs a SimulationPeriod and HomeConfigs, FleetResults.per_home_results holds
      SimulationResults, and BatteryConfig takes a GridChargeConfig; the platform constructs
      HomeConfig, SimulationPeriod, SimulationResults and GridChargeConfig. A dataclass's
      parameters are in the contract too (task 567), because they decide what a consumer can do
      with an instance: frozen whether it can assign a field (task 436 froze SimulationResults and
      had to record that break by hand, sending consumers to dataclasses.replace), eq and
      unsafe_hash how instances compare and hash, and order whether <, <=, > and >= work. The
      decorator generates these as dunders, which member forms leave out (task 404), so a
      dataclass's class form spells them as its kind, e.g. 'dataclass[eq, frozen] (...)'. init
      and kw_only already show in the constructor's signature, and repr is text no form pins.
      match_args, slots and weakref_slot are not pinned yet, because CPython 3.11's
      __dataclass_params__, which the kind is read from, does not record them. They too change
      what a consumer can do (match_args=False breaks a positional class pattern, and slots=True
      removes an instance's __dict__), and task 668 decides whether the contract covers them.
      The surface-lock tests are intentional gates, not redundant ceremony: the frozen-__all__
      freeze test; the three tables of tests/unit/test_public_api_surface.py, FROZEN_SURFACE (each
      name's signature, a dataclass's after its kind), FROZEN_CLOSURE (the signature, a
      dataclass's after its kind, of each class outside __all__ that the exported surface names;
      the set of classes is derived from the exported forms, so a class newly named fails until
      it is pinned or exported) and FROZEN_MEMBERS (the public members of every class those two
      tables pin); the guard beside FROZEN_MEMBERS that fails on a public attribute set on self
      that no class body declares, and on a declaration that nothing sets; the ast-parsed
      TYPE_CHECKING-block ↔ __all__ consistency check; and the isolated external-wheel install
      test (imports every __all__ name in a fresh interpreter). All three tables are spelled alike
      on every admitted Python minor, and each fails until its table edit lands, naming every
      drifted symbol and asking for the change's 'Unreleased on main' line in the same commit.
      `__init__.py` is
      deliberately LAZY (PEP-562 __getattr__ + _SYMBOL_MODULE map) so `import solar_challenge`
      stays pvlib-free; the
      import-time _SYMBOL_MODULE/__all__ sync check uses raise RuntimeError (not assert) on
      purpose so it survives -O/-OO. The DispatchTariffPeriod alias (dispatch.TariffPeriod enum,
      re-exported renamed to avoid colliding with tariff.TariffPeriod) is intentional. Do not
      "tidy" any of this away.

  - rule: >
      Downstream consumers depend on this library pinned to a release TAG, never an editable path,
      exactly as docs/domain-library-consumption.md prescribes. That recipe is the authoritative
      statement of the dependency line and the release steps, and it must name the same git remote
      that solar-challenge-platform actually pins. The consumer's pyproject.toml and uv.lock are
      committed together, and a pin bump is a reviewed commit.
    why: >
      An editable/path dependency resolves the live main checkout shared by every worktree, so a
      sim `main` merge would change bytes underneath all in-flight consumer worktrees (flaky
      verify, violates input-stability). A tag pin is content-addressed and immutable — lib
      upgrades become deliberate consumer commits. The tag-cutting discipline (and the
      consumption recipe doc) lives in THIS repo.

  - rule: >
      Board-facing finance/model changes must ship with a human-readable model doc
      (docs/cost-recovery-finance-model.md) AND pass a final adversarial code↔doc verification
      gate — every doc equation traces to code, no unmodelled term, the worked example reproduces
      to the penny. Green unit tests are NOT sufficient acceptance.
    why: >
      These numbers drive a ~£750k share-offer + install-spec decision; "the board can trust the
      numbers" must be made explicit. A doc-vs-code adversarial pass catches model-misimplementation
      that synthetic-input unit tests miss. (User feedback, 2026-06-17.)

  - rule: >
      "Basis-C" own-use accounting (own_use_kwh = total_demand − total_grid_import) is INTENTIONAL
      and arbitrage-immune; it deliberately differs from physics self-consumption
      (min(direct + battery_discharge, demand)) when grid-charging is active. Do not "fix" it to
      match the physics figure.
    why: >
      Grid-charged battery discharge inflates the physics self-consumption figure (B-style) but NOT
      (demand − import), because grid-charged energy is counted in grid_import. Billing CBS own-use
      on Basis C means the CBS — not the householder — bears the battery round-trip loss (absorbed
      into the headline own-use rate). This is the v0.4.0 "arbitrage fix"; a reviewer seeing
      _cbs_own_use_kwh diverge from self-consumption should know it's correct by design.

  # --- Standing review invariants (recorded per /review-briefing policy) ---
  - rule: >
      TODO-tracking invariant: every real TODO/FIXME/HACK marker (and stub idioms like
      NotImplementedError) must be tracked by a NON-TERMINAL task whose brief names resolving it.
    why: >
      Keeps intentional-vs-forgotten distinguishable. CURRENT STATE: NO known real code
