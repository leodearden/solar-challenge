  # human-edited — the why below deliberately stores no verdict on the live
  # tree; see the POSTURE header above for the drift history this avoids
  # repeating.
  - rule: >
      Deferred-task invariant: no task may sit in `deferred` status without a concrete, actionable
      flip-to-pending condition recorded on it.
    why: >
      `deferred` without a trigger is quarantine rot nobody polls. This briefing deliberately
      stores no verdict on the current tree — earlier revisions asserted the check's outcome
      directly here (see the POSTURE header above for the drift history) and that assertion went
      stale before its own fix branch could even merge, across every prior recurrence. Derive the
      current state live via get_statuses(project_root=...) and confirm every task currently
      sitting in `deferred` status carries a concrete, actionable flip-to-pending condition.

subprojects:
  simulation-core:
    purpose: >
      Physics-based energy-flow simulator for domestic PV + battery systems at 1-minute
      resolution. Models solar generation (pvlib/PVGIS, with live PV-degradation by system age),
      household demand (base load + EV charging + heat-pump heating), battery dispatch (including
      rate-aware TOU grid-charging / arbitrage), and grid interaction — for a single home or a
      heterogeneous 100-home fleet — plus a post-hoc community-sharing layer (P2P netting /
      shared community battery / virtual-net-metering). It produces the energy aggregates the
      finance layer consumes, so the physics drives a real investor-viability case.

    key_scenarios:
      - "A single home is configured and simulated over a date range, producing a minute-resolution energy time series plus summary stats (self-consumption, grid dependency, costs/revenue)."
      - "A heterogeneous 100-home fleet is generated by sampling per-component distributions (weighted-discrete / normal / uniform / shuffled-pool / proportional), run in parallel, and aggregated; aggregate totals equal the sum of per-home results."
      - "The same home is run under each dispatch strategy (self-consumption / TOU-optimised / peak-shaving) to quantify grid-import reduction and peak shaving."
      - "A home on a TOU tariff with grid-charging enabled charges the battery FROM THE GRID during cheap periods when the round-trip price spread is profitable and the battery is below target SOC (arbitrage), with grid-charge energy and cost accounted separately so the energy balance still closes."
      - "A home with an EV (none / solar-shifted / off-peak smart charging) or a heat pump (ASHP/GSHP, outdoor-temperature-driven COP) adds the corresponding load to base demand before dispatch."
      - "PV generation is degraded for the array's age (system_age_years × degradation_rate_per_year) inside the live simulation, so long-run yield reflects ageing."
      - "A fleet's results are passed to the community layer and netted either instantaneously P2P or through a shared community battery, with VNM £ billing — without re-simulating any home."
      - "A parameter sweep runs many fleet variants in one process pool for sensitivity analysis."

    what_working_means:
      - "Energy balance closes at every timestep, including the community composition (no ValueError from the flow / community validators)."
      - "validation.py sanity checks pass: non-negative generation capped near capacity, ~zero night generation, annual yield per wired kWp within 300-1200 kWh/kWp (the range PVGIS and MCS give UK arrays facing east to west through south), self-consumption within the bands MCS MGD 003 gives a home using 3,000-3,499 kWh a year with 4 kWp of PV: 10-45% PV only, 35-90% with a 5 kWh battery."
      - "Fleet aggregate totals equal the sum of per-home results."
      - "The same seed reproduces the identical fleet and per-home stochastic profiles regardless of parallel execution order."

    key_decisions:
      - decision: "Fleet runs use ProcessPoolExecutor (subprocesses), not threads."
        why: "Work is CPU-bound numpy/pvlib; the GIL would serialise threads. Frozen dataclass configs pickle cleanly to workers; workers receive their weather in the job, a PrefetchedWeather of their home's location fetched once in the calling process, so no worker reads the cache or the network under any start method."
      - decision: "Weather is TMY-based and aligned to the simulation period by UTC month-day-time, discarding the TMY's own year; a UTC 29 February the TMY lacks repeats the TMY's 28 February, for PV and air temperature alike; hourly PV/temperature is expanded to 1-minute by forward-fill (repeat each hour's value)."
        why: "The TMY is a synthetic 'typical year', so aligning by time of year lets a sim over real dates use typical conditions; that is intentional, not a date bug. The match uses the UTC clock because the PVGIS TMY is UTC-indexed and pvlib places the sun at those UTC instants. Matching the demand's local wall clock ran BST PV output and heat-pump temperature an hour early (fixed by task 166). Forward-fill preserves hourly energy totals exactly and deliberately does NOT synthesise sub-hourly variability. Repeating 28 February is the usual TMY practice for a leap year; the former 0.0 fill gave every default (leap-year 2024) run a 29 February with no PV and 0 °C air for the heat pump (task 190)."
      - decision: "get_tmy_data scales the PVGIS TMY's ghi, dni and dhi by one factor, so its annual GHI equals PVGIS's 2005-2020 mean at the point."
        why: "PVGIS's TMY month picks do not preserve annual irradiation, and Bristol's sat below every year (992 vs a mean of 1069 kWh/m²), so the scaling is deliberate, not a bug. With the PV model's system losses, Bristol's per-kWp yields sit inside validation's band (the default 4 kW reads about 1012 kWh/kWp under NOCT-SAM, re-measured by task 823). docs/tmy-irradiation-scaling.md has the measurements and scripts/measure_tmy_irradiation.py re-measures them; re-measure before re-flagging."
      - decision: "Two dispatch paths coexist (a Strategy-pattern family and a rate-aware TOU path), and BOTH now support grid-charging; SelfConsumptionStrategy deliberately accepts-but-ignores the grid-charge context."
        why: "A home only grid-charges if it uses a tou_optimized or peak_shaving strategy with a tariff AND a GridChargeConfig — self-consumption homes never grid-charge even if GridChargeConfig is set. There are also TWO unrelated TariffPeriod symbols (dispatch.py enum vs tariff.py dataclass). Both are intentional; don't unify them."
      - decision: "community.py is a POST-HOC aggregation layer: it consumes FleetResults' public aggregate API and does NOT re-simulate homes or feed back into per-home dispatch; fleet.py's public API is left unchanged."
        why: "Sharing is a value-allocation/aggregation layer over independently-simulated homes (matches the Energy-Local legal model). A reviewer expecting community results to influence home dispatch should know it's intentionally downstream. NOTE: the community battery currently hardcodes SelfConsumptionStrategy — it cannot yet dispatch on TOU/peak-shaving."
      - decision: "PV degradation lives on PVConfig (system_age_years, degradation_rate_per_year), not HomeConfig; applied linearly inside simulate_pv_output."
        why: "Degradation is a PV-array property and simulate_pv_output already takes PVConfig → zero signature churn. Model is linear factor = max(0, 1 - age*rate); no first-year Staebler-Wronski / exponential term, by choice."
      - decision: "CEC inverter strings are sized on the module's STC V_mp_ref, not a cold-corrected V_mp, so on cold hours some strings run a little above the inverter's MPPT ceiling."
        why: "Re-measured by task 823 on the scaled Bristol TMY, under NOCT-SAM's cell temperature and with the system losses: those hours cost at most 0.46% of annual AC (median 0.055%), while sizing with cold headroom (a 0 °C design cell) re-picks inverters and moves affected capacities' annual AC by a median of 0.1-0.3% and up to 1.4% (1.7% on a 5 kW inverter), in either direction. Task 203's SAPM-era margin of more than ten times has narrowed: 36 of the 214 re-picks move AC by less than the error they remove. docs/pv-inverter-string-matching.md has the figures and scripts/measure_mppt_window.py re-measures them; re-measure before re-flagging."
      - decision: "Battery inverter/chargers (nominal DC <= 60 V, rated above 1.5 kW) are left out of the CEC inverter candidates, and the MPPT floor, like the ceiling, is checked at STC."
        why: "Their MPPT window is a battery bus's voltage range, which PV reaches only through a charge controller, so modules wired straight to one ran below its floor. Measured by task 240 on the scaled Bristol TMY: leaving them out re-picked 23 of the 992 census configs. Re-measured by task 823 under NOCT-SAM's cell temperature and with the system losses, the floor's worst remaining error is about 0.03% of annual AC, and hot-cell floors move AC by more than the error they remove. docs/pv-inverter-string-matching.md §7 has the figures and scripts/measure_mppt_window.py re-measures them; re-measure before re-flagging."
      - decision: "PVConfig.inverter_efficiency (default 0.96) is every inverter's efficiency at rated output: the voltage-matched CEC inverter's Pdco is always Paco / inverter_efficiency, replacing its catalogue efficiency, and create_pv_system names the picked CEC row as PVSystem.inverter."
        why: "The CEC pick is by rating and MPPT window, so the picked inverter's own Paco/Pdco is incidental (0.892-0.983 across 0.3-25 kW, jumping between neighbouring capacities). Until task 236, 0.96 was a sentinel that kept the catalogue value, so the documented default was not modelled and fleet distributions were discontinuous at 0.96. With Pdco configured, the parameters match no catalogue row, so a reader needing the pick's name takes PVSystem.inverter. docs/pv-inverter-efficiency.md has the figures; do not restore the catalogue efficiency, a sentinel, or a parameter-row lookup of the name."
      - decision: "PV generation carries PVWatts v5's default 14.08% system-loss budget on each array's DC power, before the inverter, at unchanged voltage."
        why: "It covers the losses the model does not otherwise compute, and puts the annual performance ratio near MCS's 0.8 (Bristol 0.82 under NOCT-SAM, re-measured by task 823). Do not stack PVGIS's 14%, which includes the inverter and ageing the model already computes, and do not move it to the AC, which would stop inverter-limited arrays clipping at their rating. docs/pv-system-losses.md has the measurements and scripts/measure_pv_performance_ratio.py re-measures them; re-measure before re-flagging."
      - decision: "Every array's cell temperature is pvlib's NOCT-SAM (noct_sam), fed the module's own T_NOCT and its rating / (A_c x 1000) as its efficiency, with DEFAULT_CEC_MODULE's value for either key a custom module lacks; a T_NOCT or A_c with which NOCT-SAM cannot heat the cells above the air raises ValueError."
        why: "Leo's 2026-10-15 ruling (program D32): one generic SAPM set for every module meant a module's efficiency could not act on output. Under NOCT-SAM, Bristol's default 4 kW yields 1012.1 kWh per wired kWp (from 993.1 under SAPM), performance ratio 0.819, inside tests/integration/test_pv_performance_ratio.py's 0.76-0.84. noct_sam divides by the in-plane irradiance, so a run chain's cell temperature is NaN in every sunless hour; that is expected, and pvlib fills the DC and AC with 0 there. Do not restore the SAPM open-rack glass/glass set. docs/pv-cell-temperature.md has the decision and the measurements, and scripts/measure_pv_performance_ratio.py re-measures Bristol; re-measure before re-flagging."
      - decision: "PVConfig.module_efficiency and temperature_coefficient are Optional, None by default, which keeps the template module's own values (custom_module_params, or DEFAULT_CEC_MODULE's row). A set temperature_coefficient solves a CEC single-diode template's Adjust, keeping its STC point, and sets gamma_r, or sets a PVWatts template's gamma_pdc; a set module_efficiency sets A_c from the module's rating. Out-of-domain values, a coefficient on a module in neither form, and one no Adjust reaches raise ValueError naming the field."
        why: "Program D14 (both become live model inputs, derived STC-consistently from the template) and D32 (unset means the module's own). Do not restore the gamma_pdc sentinel, which the CEC model never read, and do not retire the fields (cancelled task 195). Do not assert an annual-yield direction for the coefficient: a steeper one gains over a Bristol year (x1.0055 at -0.005 per K), because the cells spend most of it below 25 °C. docs/pv-module-settings.md has the decision and the measurements, and tests/unit/test_pv_module_settings.py checks them."
      - decision: "validation's annual-yield band is 300-1200 kWh per wired kWp: the range PVGIS (at its 14% loss) and MCS's Kk tables give an unshaded UK array facing east, west or between them through south, at any pitch, rounded outward to the next hundred."
        why: "The check knows neither the site nor, in `validate results`, the orientation, so the band must hold every in-scope UK array: it catches gross errors, not a few percent, and tests/integration/test_pv_performance_ratio.py guards the model's losses. VAL-001's 800-1000 had no source, and its widened 700-1100 failed real systems (PVGIS: Eastbourne optimal 1175; MCS: Lerwick west at 45°, 580). Never fit the edges to the model's output. docs/pv-annual-yield-benchmark.md §2 has the references and §5 their figures; re-query them before re-flagging."
      - decision: "validation's self-consumption bands are 10-45% PV only and 35-90% with a 5 kWh battery: the range MCS MGD 003's lookup tables give a home using 3,000-3,499 kWh a year with 4 kWp of PV facing within 90° of south at any pitch, in any of its three occupancy archetypes, rounded outward to the next 5 points."
        why: "MGD 003 is the self-consumption method MIS 3002 requires of MCS installers. The checks know neither the household's occupancy nor the array's site and orientation, so each band holds every in-scope home: it catches off-archetype homes and gross dispatch errors, not a few points. The bands they replaced, 20-45% and 50-90%, had no source and contradicted their own docstrings (~25-35%, ~60-80%). Outside a band, the size notes read the run's own totals: its generation over its demand, not nameplate kW x 900, and a battery against a day of its demand, not of the target. Never fit the bands to the model's output. docs/self-consumption-benchmark.md has the MGD 003 cells and the model's dated figures; re-read it before re-flagging a band's width."

