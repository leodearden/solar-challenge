# Bristol Arbitrage Demo — TOU Grid-Charging Economics Scenario
#
# Demonstrates battery arbitrage with Economy 7 pricing:
# - Grid-charges overnight at Economy 7's off-peak rate
# - Discharges into its evening peak, reducing net cost
#
# The battery's dispatch_strategy block, strategy_type: tou_optimized with no
# peak_hours, dispatches it with TOUOptimizedStrategy on Economy 7's clock: it
# grid-charges in the tariff's cheap minutes and discharges in its dear ones.
#
# use_stochastic: false gives the deterministic Elexon Profile Class 1 load
# with a real evening peak at 18:00, ensuring the battery cycles fully on
# any winter day (Jan daily demand ~11 kWh >> battery usable capacity ~4 kWh).

name: Bristol Arbitrage Demo
description: >
  Single-home Economy 7 grid-charging arbitrage demonstration.
  Charges battery overnight at Economy 7's off-peak rate, discharges into its evening peak.
  Its battery's dispatch_strategy, tou_optimized on Economy 7's clock, runs the arbitrage controller.

location:
  latitude: 51.45
  longitude: -2.58
  timezone: Europe/London
  altitude: 11.0
  name: Bristol, UK

# Short winter window for a fast demo (A/B test overrides start/end directly)
period:
  start_date: "2024-01-15"
  end_date: "2024-01-15"

home:
  pv:
    capacity_kw: 4.0
    azimuth: 180
    tilt: 35

  battery:
    capacity_kwh: 5.0
    max_charge_kw: 2.5
    max_discharge_kw: 2.5
    # tou_optimized with no peak_hours dispatches on Economy 7's clock
    dispatch_strategy:
      strategy_type: tou_optimized
    grid_charging:
      target_soc_fraction: 0.9

  load:
    annual_consumption_kwh: 3400
    use_stochastic: false

  # Economy 7 at its preset rates (tariff.PRESET_RATES) and off-peak window; set
  # off_peak_rate, peak_rate, off_peak_start or off_peak_end to override.
  tariff:
    type: economy_7

# SEG export pricing for real (non-zero PV) runs.
# The CLI home/fleet run paths thread this into HomeConfig.seg_tariff automatically.
# Callers using load_scenarios().home directly must wire ScenarioConfig.seg_tariff_pence_per_kwh
# into HomeConfig.seg_tariff manually (e.g. via dataclasses.replace).
seg:
  rate_pence_per_kwh: 15.0
