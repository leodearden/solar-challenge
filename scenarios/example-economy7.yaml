# Economy 7 Tariff Example
#
# Demonstrates time-of-use tariff configuration with Economy 7
# (7 hours off-peak overnight rate)
#
# This example shows a simple scenario with:
# - Single home in Bristol with solar + battery
# - Economy 7 tariff at its preset rates and off-peak window
# - Cheaper overnight electricity ideal for battery charging

name: Economy 7 Example

period:
  start_date: "2024-01-01"
  end_date: "2024-12-31"

location:
  latitude: 51.45
  longitude: -2.58
  timezone: Europe/London
  altitude: 11.0
  name: Bristol, UK

# Single home configuration with PV, battery, and tariff
home:
  pv:
    capacity_kw: 4.0
    azimuth: 180
    tilt: 35

  battery:
    capacity_kwh: 5.0
    max_charge_kw: 2.5
    max_discharge_kw: 2.5
    efficiency: 0.95

  load:
    annual_consumption_kwh: 3400

  # Economy 7 at its preset rates (tariff.PRESET_RATES) and off-peak window; set
  # off_peak_rate, peak_rate, off_peak_start or off_peak_end to override.
  tariff:
    type: economy_7
