# solar_challenge — dark-factory orchestrator configuration.
# Package defaults live in dark-factory/orchestrator/defaults.yaml; this file
# overrides only what is project-specific.

project_root: "/home/leo/src/solar-challenge"

# Orchestrator-level daily cost ceiling. The package default ($200,
# defaults.yaml:330) is a pre-failover backstop that trips during normal
# operation now that per-account Max caps are the real spend governor — spend
# here is notional/imputed across flat-rate Max subscription accounts, not
# metered API billing. Mirrors dark-factory's own config.yaml:51 (10000.0 =
# effectively disabled). Without this, the scheduler self-pauses on the stale
# default during architect-heavy days (the known false-positive pattern).
orch_daily_cost_ceiling_usd: 10000.0

# Shared fused-memory HTTP server (one server, all projects). Only project_id
# is per-project; the URL is always 8002.
fused_memory:
  url: "http://127.0.0.1:8002"
  project_id: "solar_challenge"
  server_command: []

# Escalation MCP — unique port per project; MUST match .mcp.json so interactive
# sessions and the orchestrator share one escalation server.
escalation:
  queue_dir: "data/escalations"
  port: 8106

# Verification commands — run inside a fresh git worktree, so they must work
# without anything that isn't committed. This project is editable-installed into
# a local venv/ (gitignored), which a worktree won't have — so we use `uv run`,
# which resolves pyproject deps into an ephemeral per-worktree .venv. Validated
# during factory-init: `uv run --extra dev` builds the package + imports cleanly.
#
# Every `uv run` here and in git.offline_lane_commands passes --locked, so uv
# refuses a uv.lock that pyproject.toml has outgrown, with an error naming the
# fix (`uv lock`), instead of silently re-locking it in the worktree. That
# silent re-lock let a commit that forgot `uv lock` pass verify and merge its
# stale lock (tests/unit/test_stale_uv_lock.py guards this).
#
# Tests exclude the `slow` marker (real PVGIS network calls) and `e2e`
# (playwright browser tests) — neither belongs in a per-task verify loop; the
# offline lane's e2e job runs the non-slow e2e suite after every merge instead,
# and its pvgis job runs the PVGIS contract tests, the slow tests that check
# PVGIS itself.
# The `web` extra is required: every test module that needs it calls
# pytest.importorskip, so without it those modules skip rather than fail and
# the verify passes while silently losing their coverage
# (tests/unit/test_per_task_verify.py guards this). `--ignore=tests/e2e` keeps
# the playwright suite out of collection (the `not e2e` marker only deselects
# post-collection, which still trips the playwright import).
test_command: "uv run --locked --extra dev --extra web pytest -m 'not slow and not e2e' --ignore=tests/e2e"
# No-op: the lint runs in the test suite (tests/unit/test_lint.py); docs/lint-gate.md says why.
lint_command: "true"
# `--extra web` so web/* modules type-check against their real deps (flask).
type_check_command: "uv run --locked --extra dev --extra web mypy src/solar_challenge"

git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"
  # Offline lane: after every merge to main it runs each offline_lane_commands
  # job in order, off the merge path at idle priority; it never gates a merge.
  # A confirmed red files a fix task naming the failing node-ids.
  # - interpreter-matrix: the verify suite on each Python minor requires-python
  #   admits except the .python-version pin.
  # - e2e: the non-slow Playwright suite. LaneCommand has no timeout field and
  #   the lane is single-flight, so without `timeout` a hung browser run would
  #   stall every later lane run; 1800 s is ~8x the measured 214 s run.
  # - pvgis: the PVGIS contract tests (tests/integration/test_pvgis.py). They
  #   check PVGIS's live TMY, so a change in PVGIS or pvlib is seen; an outage
  #   outlasting a run and its confirm re-run files a fix task, never a silent
  #   green (CLAUDE.md says how to tell one). `timeout` caps a hung request at
  #   600 s; a run measures ~20 s: uv syncs a fresh .venv, then 11 s of tests.
  # - css-build: rebuilds static/dist/style.css in a scratch copy from the
  #   committed sources and package-lock.json (tests/css_build), and goes red
  #   when the committed file differs, e.g. after an unrebuilt
  #   tailwind.config.js edit, or when the Tailwind license texts beside it are
  #   not the locked tailwindcss package's. It needs npm and registry.npmjs.org.
  #   `timeout` caps a hung run at 600 s; a run measures 17-38 s, by host load:
  #   uv syncs a fresh .venv, then 6-19 s of npm ci and the build.
  # - newest-releases: re-runs the verify suite in a scratch copy of the tree
  #   whose uv.lock is upgraded to the newest releases pyproject.toml's ranges
  #   admit (tests/newest_releases), the releases a consumer that re-locks
  #   installs, so an upstream release that breaks this code files a fix task.
  #   It needs PyPI. Like interpreter-matrix it has no `timeout`: its suite
  #   timeout bounds a hang. A run measures 17-19 min, by host load.
  # The legacy numeric and infra seams are off: this repo has neither
  # scripts/run-offline-deep.sh nor reify's tests/infra/run_all.sh.
  # offline_lane_enabled and persistent_offline_deep_worktree take effect at
  # orchestrator restart (the fleet redeploy applies them); offline_lane_commands
  # is hot-reloadable.
  persistent_offline_deep_worktree: true
  offline_lane_enabled: true
  offline_lane_legacy_numeric_enabled: false
  offline_lane_infra_enabled: false
  offline_lane_commands:
    - name: interpreter-matrix
      command: "uv run --locked --extra dev pytest tests/interpreter_matrix"
      fix_task_priority: "medium"
    - name: e2e
      command: "timeout -k 60 1800 uv run --locked --extra dev --extra web --extra e2e pytest tests/e2e -m 'not slow' -p no:cacheprovider"
      fix_task_priority: "medium"
    - name: pvgis
      command: "timeout -k 60 600 uv run --locked --extra dev pytest tests/integration/test_pvgis.py -p no:cacheprovider"
      fix_task_priority: "medium"
    - name: css-build
      command: "timeout -k 60 600 uv run --locked --extra dev pytest tests/css_build -p no:cacheprovider"
      fix_task_priority: "medium"
    - name: newest-releases
      command: "uv run --locked --extra dev pytest tests/newest_releases -p no:cacheprovider"
      fix_task_priority: "medium"

# OS filesystem sandbox (Landlock) — dark-factory-fleet OS filesystem sandbox
# rollout, fleet-remainder wave (PRD os-sandbox-worktree-containment in the
# dark-factory repo), gated on the reify wave. Kernel-enforced whole-
# filesystem read-only except each task's own writable scope; backend pinned
# to landlock (the proven fleet backend; bwrap is effectively dead
# fleet-wide). `sandbox.*` is not in the config hot-reload allowlist, so this
# edit is inert until the next orchestrator restart — the scheduled fleet
# redeploy applies it, so no separate deploy task is needed for this project.
sandbox:
  enabled: true
  backend: landlock
