# solar_challenge — dark-factory orchestrator configuration. Rationale for each setting: docs/orchestrator-config.md.
# Overrides only what is project-specific; package defaults live in dark-factory/orchestrator/defaults.yaml.
project_root: &project_root "/home/leo/src/solar-challenge"

# Cost ceiling: effectively disabled; per-account Max caps govern spend.
orch_daily_cost_ceiling_usd: 10000.0

# Shared fused-memory server; only project_id is per-project.
fused_memory:
  url: "http://127.0.0.1:8002"
  project_id: "solar_challenge"
  server_command: []

# Escalation MCP; the port must match .mcp.json.
escalation:
  queue_dir: "data/escalations"
  port: 8106

# Verify commands run in a fresh worktree via `uv run --locked`.
test_command: "uv run --locked --extra dev --extra web pytest -m 'not slow' --ignore=tests/e2e"
lint_command: "true"
type_check_command: "uv run --locked --extra dev --extra web mypy src/solar_challenge"

# Cgroup scope for verify legs; restart tier.
verify_use_cgroup_scope: true

# Warm per-command verify timeout; restart tier.
verify_command_timeout_secs: 3600

# Merge-verify runners: docs/laptop-merge-verify.md.
verify_runners:
  - name: laptop
    ssh_host: leo-laptop
    git_remote: leo-laptop
    config_path: /home/leo/.config/orchestrator/solar-challenge-laptop.yaml
    df_checkout_path: /home/leo/src/dark-factory
    enabled: true
verify_host_policy: prefer_remote
verify_drift_check_every_n_lands: 10
verify_cross_check_remote_green: false
verify_env_probes:
  - key: uv
    argv: ["uv", "--version"]
  - key: uv-python
    argv: ["uv", "python", "find", "--system", "--directory", *project_root]
  - key: uv-run-python
    argv: ["uv", "run", "--directory", *project_root, "--no-project", "--isolated", "--no-python-downloads", "python", "-c", "import sqlite3, sys; print(sys.version.split()[0], sqlite3.sqlite_version)"]
  - key: git
    argv: ["git", "--version"]

# Branch layout and the offline lane, whose jobs never gate a merge.
git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"
  persistent_offline_deep_worktree: true
  offline_lane_enabled: true
  offline_lane_legacy_numeric_enabled: false
  offline_lane_infra_enabled: false
  offline_lane_commands:
    - name: interpreter-matrix
      command: "uv run --locked --extra dev pytest tests/interpreter_matrix"
      fix_task_priority: "medium"
      outage_probe: "uv run --locked --extra dev python scripts/outage_probe.py pypi"
      outage_probe_timeout_secs: 180
    - name: e2e
      command: "timeout -k 60 1800 uv run --locked --extra dev --extra web --extra e2e pytest tests/e2e -m 'not slow' -p no:cacheprovider"
      fix_task_priority: "medium"
    - name: pvgis
      command: "timeout -k 60 600 uv run --locked --extra dev pytest tests/integration/test_pvgis.py -p no:cacheprovider"
      fix_task_priority: "medium"
      outage_probe: "uv run --locked --extra dev python scripts/outage_probe.py pvgis"
      outage_probe_timeout_secs: 180
    - name: css-build
      command: "timeout -k 60 600 uv run --locked --extra dev pytest tests/css_build -p no:cacheprovider"
      fix_task_priority: "medium"
      outage_probe: "uv run --locked --extra dev python scripts/outage_probe.py npm"
      outage_probe_timeout_secs: 180
    - name: newest-releases
      command: "uv run --locked --extra dev pytest tests/newest_releases -p no:cacheprovider"
      fix_task_priority: "medium"
      outage_probe: "uv run --locked --extra dev python scripts/outage_probe.py pypi"
      outage_probe_timeout_secs: 180

# Landlock filesystem sandbox; restart tier.
sandbox:
  enabled: true
  backend: landlock

# Fleet-wide enforcement flags; restart tier.
convert_to_blocked_enforce: true
workflow_exit_contract_enforce: true
