[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-challenge"
version = "0.5.0"
description = "Energy flow simulator for domestic PV and battery systems"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "src/solar_challenge/web/static/vendor/*/LICENSE*", "src/solar_challenge/web/static/dist/LICENSE*"]
authors = [
    {name = "Leo Dawn"}
]
keywords = ["solar", "pv", "battery", "energy", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pvlib>=0.15.1",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "typer>=0.26.3",
    "rich>=15.0.0",
    "richardsonpy>=0.2.3",
    "scipy>=1.17.1",
]

[project.scripts]
solar-challenge = "solar_challenge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=2.1.0",
    "packaging>=26.2",
    "pytest-rerunfailures>=16.7",
    "ruff>=0.16.10",
    "requests>=2.34.2",  # used directly by tests/unit/test_network_guard_helper.py
]
stochastic = []  # backward-compat alias; richardsonpy is now a core dependency
web = [
    "flask>=3.1.3",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "anthropic>=0.105.2",  # streaming chat endpoint in web/assistant.py (imported lazily)
    "werkzeug>=3.1.8",
    "jinja2>=3.1.6",  # used directly by the web tests
]
e2e = [
    "playwright>=1.61.0",
    "pytest-playwright>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solar_challenge = ["py.typed"]
"solar_challenge.web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Every pytest deprecation is an error; tests/unit/test_pytest_deprecations_are_errors.py says why.
filterwarnings = ["error::pytest.PytestDeprecationWarning"]
# An unregistered mark fails collection; tests/unit/test_unregistered_marks_are_refused.py says why.
strict_markers = true
markers = [
    "slow: tests that make real external API calls (e.g. PVGIS)",
    "build: tests that invoke the build toolchain (uv build --wheel); requires uv and cached build-backend deps",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["venv", ".venv", "build", "dist"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pvlib.*", "pandas.*", "numpy.*", "yaml", "richardsonpy.*", "flask.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Flask's Blueprint/app decorators are untyped; suppress untyped-decorator noise
# across the entire web sub-package. Unused type-ignores are still rejected here
# (strict = true), as everywhere else in the package.
module = ["solar_challenge.web.*"]
disallow_untyped_decorators = false

[tool.ruff.lint]
# The rules tests/unit/test_lint.py holds the package and its tests to; docs/lint-gate.md says why.
select = ["E402", "E7", "E9", "F"]
